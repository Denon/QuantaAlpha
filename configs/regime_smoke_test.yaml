######################################################################
# Smoke test config: walk-forward with regime detection
######################################################################

random_seed: 42

experiment:
  name: "regime_smoke_test"
  recorder: "regime_smoke_rec"
  output_dir: "data/results/regime_smoke_test"

factor_source:
  type: "alpha158_20"

data:
  provider_uri: "~/.qlib/qlib_data/cn_data"
  region: "cn"
  market: "csi300"
  start_time: "2018-01-01"
  end_time: "2020-12-31"

dataset:
  label: "Ref($close, -2) / Ref($close, -1) - 1"
  learn_processors:
    - class: "Fillna"
      kwargs:
        fields_group: "feature"
    - class: "ProcessInf"
    - class: "DropnaLabel"
    - class: "CSRankNorm"
      kwargs:
        fields_group: "feature"
  infer_processors:
    - class: "Fillna"
      kwargs:
        fields_group: "feature"
    - class: "ProcessInf"
    - class: "CSRankNorm"
      kwargs:
        fields_group: "feature"
  segments:
    train: ["2018-01-01", "2019-06-30"]
    valid: ["2019-07-01", "2019-12-31"]
    test:  ["2020-01-01", "2020-12-31"]

model:
  type: "lgb"
  params:
    loss: "mse"
    learning_rate: 0.1
    max_depth: 8
    num_leaves: 210
    colsample_bytree: 0.8879
    subsample: 0.8789
    lambda_l1: 205.6999
    lambda_l2: 580.9768
    num_threads: 20
    seed: 42
    random_state: 42
    early_stopping_round: 50
    num_boost_round: 500
    min_child_samples: 100
    feature_fraction_bynode: 0.8

backtest:
  strategy:
    class: "TopkDropoutStrategy"
    module_path: "qlib.contrib.strategy"
    kwargs:
      signal: "<PRED>"
      topk: 50
      n_drop: 5
  backtest:
    start_time: "2020-01-01"
    end_time: "2020-12-31"
    account: 100000000
    benchmark: "SH000300"
    exchange_kwargs:
      limit_threshold: 0.095
      deal_price: "open"
      open_cost: 0.0005
      close_cost: 0.0015
      min_cost: 5

walk_forward:
  enabled: true
  start_time: "2018-01-01"
  end_time: "2020-12-31"
  selection_window_months: 6
  forward_window_months: 6
  step_months: 6
  selection_lag_days: 2
  internal_valid_ratio: 0.2
  top_k: 5
  min_selection_days: 10
  regime_method: "volatility_direction"
  regime_vol_window: 60
  regime_n_regimes: 2
